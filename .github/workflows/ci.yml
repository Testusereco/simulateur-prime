name: CI

on:
  push:
  pull_request:

jobs:
  java-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer le JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Lancer les tests Java (mvn test)
        run: mvn -B test

  angular-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Installer les dépendances Angular
        working-directory: ui
        run: npm install --legacy-peer-deps

      - name: Lancer les tests Angular (ng test)
        working-directory: ui
        run: npx ng test --watch=false

  e2e-tests:
    needs: [java-tests, angular-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer le JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances Angular
        working-directory: ui
        run: npm install --legacy-peer-deps

      - name: Installer les dépendances Playwright
        working-directory: e2e
        run: npm install --legacy-peer-deps

      - name: Installer les navigateurs Playwright
        working-directory: e2e
        run: npx playwright install --with-deps

      - name: Lancer les tests Playwright (E2E)
        working-directory: e2e
        run: npx playwright test